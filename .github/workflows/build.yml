name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Keep the same signing key between builds, so new versions install over the old one.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: cleantv-debug-keystore

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Fonts (SIL Open Font License) from the Google Fonts repository.
      - name: Download fonts
        run: |
          mkdir -p app/src/main/res/font
          base=https://github.com/google/fonts/raw/main/ofl
          curl -fsSL -o app/src/main/res/font/casa_script.ttf "$base/dancingscript/DancingScript%5Bwght%5D.ttf"
          curl -fsSL -o app/src/main/res/font/casa_serif.ttf "$base/lora/Lora%5Bwght%5D.ttf"
          curl -fsSL -o app/src/main/res/font/casa_serif_italic.ttf "$base/lora/Lora-Italic%5Bwght%5D.ttf"

      - run: gradle assembleDebug --no-daemon

      - run: cp app/build/outputs/apk/debug/app-debug.apk CleanTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CleanTV
          path: CleanTV.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: CleanTV (ultima build)
          files: CleanTV.apk
          make_latest: true
